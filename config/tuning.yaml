# Settings for `natgas tune` and the experiment notebooks.
# Each model maps to its config class in src/models.
# "grid" is used by grid search, "search_space" by Bayesian search.
# Leave either out to use the config class defaults.

target_column: high        # column in the prices table to forecast

backtest:
  horizon_days: 30         # trading days to forecast from each as-of date
  start: "2022-01-01"      # first as-of date
  end:                     # last as-of date, blank means the latest data
  step_days: 14            # calendar days between as-of dates
  n_jobs: 6                # as-of dates run in parallel

search:
  optimizer: grid          # grid or bayesian
  n_trials: 8              # Bayesian trials per model
  seed: 42
  selection_metric: mae    # mae, rmse, mape, or wape. Lowest wins.

publish:
  # Used by `natgas tune`, which still registers one overall winner.
  # The best model must beat naive by this share of error, else naive is published
  min_improvement: 0.01
  registered_model_name: natgas-price-forecaster
  alias: champion

tournament:
  # Each family has its own registry (natgas-chronos, natgas-gradient-boosting,
  # natgas-greykite) with @champion and @challenger. naive is the baseline.
  families: [chronos, gradient_boosting, greykite]
  baseline: naive
  registry_prefix: natgas-
  trial_days: 60           # matured production days before a challenger can be promoted
  window_days: 30          # production days in the blended scorecard
  min_improvement: 0.01    # a champion must beat naive in an event by this share to qualify

mlflow:
  # A database backend is needed for the model registry.
  # Run artifacts go to ./mlruns next to it.
  tracking_uri: sqlite:///mlflow.db
  experiment_name: natgas-backtests

models:
  naive: {}

  gradient_boosting:
    grid:
      n_lags: [5, 10]
      learning_rate: [0.03, 0.1]
      max_depth: [2, 4]
      use_weather: [true, false]
      use_yearly: [true, false]
    search_space:
      n_lags: {low: 3, high: 20}
      learning_rate: {low: 0.01, high: 0.3, log: true}
      max_depth: {low: 2, high: 6}
      min_samples_leaf: {low: 10, high: 100, log: true}
      use_weather: [true, false]
      use_yearly: [true, false]

  greykite:
    grid:
      history_years: [2.0, 4.0]
      autoregression_lags: [0, 3]
      use_holidays: [true, false]
      holiday_window: [2, 4]
    search_space:
      history_years: {low: 2.0, high: 8.0}
      autoregression_lags: {low: 0, high: 5}
      use_holidays: [true, false]
      holiday_window: {low: 0, high: 4}
      auto_changepoints: [true, false]
      fit_algorithm: [ridge]

  chronos:
    grid:
      context_length: [512, 1024, 2048]
      use_weather: [true, false]
      use_yearly: [true, false]
    search_space:
      context_length: {low: 64, high: 2048, step: 64}
      use_weather: [true, false]
      use_yearly: [true, false]

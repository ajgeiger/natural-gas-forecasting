# Hyperparameter search and backtest settings for `natgas tune`.
# Every list under a model is a set of options. Every combination is backtested.

target_column: high        # column in the prices table to forecast
selection_metric: mae      # mae, rmse, mape, or wape. Lowest wins.

backtest:
  horizon_days: 5          # trading days to forecast from each as-of date
  start: "2022-01-01"      # first as-of date
  end:                     # last as-of date, blank means the latest data
  step_days: 14            # calendar days between as-of dates

mlflow:
  # A database backend is needed for the model registry.
  # Run artifacts go to ./mlruns next to it.
  tracking_uri: sqlite:///mlflow.db
  experiment_name: natgas-backtests
  registered_model_name: natgas-price-forecaster
  model_alias: champion

models:
  naive: {}
  gradient_boosting:
    n_lags: [5, 10]
    learning_rate: [0.03, 0.1]
    max_depth: [2, 4]
    max_iter: [200]
    use_weather: [true, false]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natgas"
version = "0.1.0"
description = "Daily forecasts of natural gas futures prices"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [{ name = "Alex Geiger" }]
# Greykite 1.1 pins pandas below 2.0, numpy 1.26.0, and scikit-learn 1.3.1,
# so the rest of the stack is kept compatible with those versions.
dependencies = [
    "chronos-forecasting>=1.5,<2",
    "greykite==1.1.0",
    "joblib>=1.3",
    "mlflow>=3.0",
    "numpy>=1.24",
    "optuna>=3.6",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "torch>=2.2",
    "typer>=0.12",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "nbconvert>=7.0",
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
]
# Spark also needs Java 17
spark = ["pyspark>=3.5,<4"]
# filled in by later PRs
dashboard = []

[project.scripts]
natgas = "natgas.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
